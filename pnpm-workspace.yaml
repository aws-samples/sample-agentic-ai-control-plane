packages:
  - "apps/*"
  - "packages/*"

overrides:
  fastify: "5.8.5"
  vite: "8.1.3"
  # Grype CVE remediation (Medium/Low, mostly transitive). Same-major, safe:
  dompurify: "^3.4.11"
  postcss: "^8.5.16"
  # Direct dep; 0.x minor bump:
  esbuild: "^0.28.1"
  # Same-major fix versions (per grype Fix Version), safe and mature:
  "@hono/node-server": "^1.19.13"
  "@opentelemetry/core": "^2.8.0"
  uuid: "^11.1.0"
  # Same-major patch fixes for remaining transitive CVEs (grype Fix Version).
  # nanoid/js-yaml are version-SCOPED so we only patch the vulnerable major and
  # do NOT downgrade the newer majors also present in the tree (nanoid 4/5, js-yaml 4).
  mermaid: "^10.9.6"
  "js-yaml@3": "^3.14.2"
  "nanoid@3": "^3.3.8"
  "@excalidraw/excalidraw": "^0.18.1"
  "@excalidraw/mermaid-to-excalidraw": "^1.1.3"

# Supply-chain hardening (pnpm >= 10.x). See https://pnpm.io/settings
# Wait 7 days before installing newly published versions (limits exposure to
# freshly-published malicious releases).
minimumReleaseAge: 10080
# Dev/build tooling whose platform binaries publish frequently; excluded from
# the release-age gate so a full re-resolve isn't blocked by fresh patch releases.
minimumReleaseAgeExclude:
  - "turbo"
  - "@turbo/*"
  - "@emnapi/*"
  # CDK CLI must match aws-cdk-lib's cloud-assembly schema (needs >=2.1129.0);
  # the required version is newer than the 7-day window. Dev tooling, pinned exact.
  - "aws-cdk"
# Block transitive dependencies resolved from non-registry (exotic) sources.
blockExoticSubdeps: true
# Prevent updates from downgrading security-relevant settings.
trustPolicy: no-downgrade
